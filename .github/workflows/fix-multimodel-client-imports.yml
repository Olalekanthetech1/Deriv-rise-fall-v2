name: Fix Multi-Model browser imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-client-imports:
    if: "!contains(github.event.head_commit.message, 'fix: isolate browser-safe multi-model imports')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove server ML evaluator from client bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('components/custom/signals-drawer.tsx'): [
                  ("import type { EnsembleEvaluationResult } from '@/lib/multi-model-evaluator';", "import type { MultiModelEvaluationResult } from '@/lib/multi-model-ui-types';"),
                  ('EnsembleEvaluationResult', 'MultiModelEvaluationResult'),
              ],
              Path('components/custom/multi-model-evaluation-card.tsx'): [
                  ("import type { EnsembleEvaluationResult } from '@/lib/multi-model-evaluator';", "import type { MultiModelEvaluationResult } from '@/lib/multi-model-ui-types';"),
                  ('EnsembleEvaluationResult', 'MultiModelEvaluationResult'),
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed = True

          if not changed:
              print('No client import changes required.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/custom/signals-drawer.tsx components/custom/multi-model-evaluation-card.tsx
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: isolate browser-safe multi-model imports'
          git push
