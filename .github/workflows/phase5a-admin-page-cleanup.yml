name: Phase 5A Admin Page Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'fix(admin): complete Phase 5A page cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Patch admin dashboard source to remove legacy synthetic UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/admin/page.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace("  const [isSeedingTrades, setIsSeedingTrades] = useState<boolean>(false);\n", "")

          text, removed = re.subn(
              r"\n  const handleSeedTrades = async \(count: number = 20\) => \{.*?\n  \};\n\n  const handleSyncDerivTicks = async \(\) => \{",
              "\n  const handleSyncDerivTicks = async () => {",
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Phase 5A: seed-trade handler was not found exactly once')

          text = text.replace(
              "  const summary = (statsData?.summary && statsData.summary.totalTrades > 0)\n    ? statsData.summary\n    : defaultSummary;\n\n  const defaultConfidenceBrackets = [\n    { bracket: '70-79%', wins: 0, losses: 0, total: 0, winRate: 0 },\n    { bracket: '80-89%', wins: 0, losses: 0, total: 0, winRate: 0 },\n    { bracket: '90-100%', wins: 0, losses: 0, total: 0, winRate: 0 },\n  ];\n\n  const confidenceBrackets = (statsData?.confidenceBrackets && statsData.confidenceBrackets.length > 0)\n    ? statsData.confidenceBrackets\n    : defaultConfidenceBrackets;\n\n  const defaultPnlCurve = [\n    { tradeIndex: 0, pnl: 0 }\n  ];\n\n  const pnlCurve = (statsData?.pnlCurve && statsData.pnlCurve.length > 0)\n    ? statsData.pnlCurve\n    : defaultPnlCurve;\n",
              "  const summary = statsData?.summary\n    ? { ...defaultSummary, ...statsData.summary }\n    : defaultSummary;\n\n  const hasLiveTradeRecords = Number.isFinite(Number(summary.totalTrades)) && Number(summary.totalTrades) > 0;\n\n  const confidenceBrackets = Array.isArray(statsData?.confidenceBrackets)\n    ? statsData.confidenceBrackets\n    : [];\n\n  const pnlCurve = Array.isArray(statsData?.pnlCurve)\n    ? statsData.pnlCurve\n    : [];\n",
          )

          text = text.replace(
              "  const defaultEnsembleData = [\n    { strategy: 'XGBoost Horizon 5t', trades: 38, wins: 34, losses: 4, winRate: 89.5 },\n    { strategy: 'LightGBM Multi-Feature', trades: 25, wins: 21, losses: 4, winRate: 84.0 },\n    { strategy: 'ONNX Deep Classifier', trades: 18, wins: 15, losses: 3, winRate: 83.3 },\n    { strategy: 'Random Forest Baseline', trades: 12, wins: 9, losses: 3, winRate: 75.0 },\n  ];\n\n  const ensembleData = calculatedEnsemble.length > 0 ? calculatedEnsemble : defaultEnsembleData;\n",
              "  const ensembleData = calculatedEnsemble;\n",
          )

          text = text.replace("(registryModels?.[0]?.model_id || 'XGBoost-Default')", "(registryModels?.[0]?.model_id || 'No production model')")
          text = text.replace("{isDbConnected ? 'Demo & Live' : 'Database Offline'}", "{hasLiveTradeRecords ? 'Persisted live trade records' : 'No live trade records'}")
          text = text.replace("{summary.wins || 54}", "{summary.wins ?? 0}")
          text = text.replace("{summary.losses || 9}", "{summary.losses ?? 0}")

          text = text.replace(
              "                <button\n                  onClick={() => handleSeedTrades(20)}\n                  disabled={isSeedingTrades}\n                  className={`px-3.5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold shadow-lg shadow-emerald-950/40 flex items-center gap-2 transition-all disabled:opacity-50`}\n                >\n                  <Sparkles className={`w-3.5 h-3.5 ${isSeedingTrades ? 'animate-spin' : ''}`} />\n                  <span>Seed 20 Test Trades</span>\n                </button>\n",
              "                <span className={`px-3.5 py-2 rounded-xl text-xs font-bold border flex items-center gap-2 ${hasLiveTradeRecords ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>
                  <Database className=\"w-3.5 h-3.5\" />
                  <span>{hasLiveTradeRecords ? 'Live DB Records' : 'No Live Trade Records'}</span>
                </span>\n",
          )

          if text == original:
              raise SystemExit('Phase 5A: no changes were made')

          # Hard assertions so the workflow fails if any legacy UI remnants remain.
          forbidden = [
              'isSeedingTrades',
              'handleSeedTrades',
              'Seed 20 Test Trades',
              'defaultConfidenceBrackets',
              'defaultPnlCurve',
              'defaultEnsembleData',
              'XGBoost-Default',
              'Demo & Live',
              'summary.wins || 54',
              'summary.losses || 9',
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'Phase 5A: legacy UI string still present: {needle}')

          path.write_text(text, encoding='utf-8')

      - name: Validate admin source cleanup
        shell: bash
        run: |
          grep -n "No live trade records yet\|Live DB Records\|No Live Trade Records\|hasLiveTradeRecords" app/admin/page.tsx
          ! grep -n "isSeedingTrades\|handleSeedTrades\|Seed 20 Test Trades\|defaultConfidenceBrackets\|defaultPnlCurve\|defaultEnsembleData\|XGBoost-Default\|Demo & Live\|summary.wins || 54\|summary.losses || 9" app/admin/page.tsx

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build validation
        run: npm run build

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/phase5a-admin-page-cleanup.yml
          git add app/admin/page.tsx .github/workflows/phase5a-admin-page-cleanup.yml
          git commit -m "fix(admin): complete Phase 5A page cleanup"
          git push origin main
