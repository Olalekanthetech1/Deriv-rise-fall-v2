name: Phase 5A Final Admin Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'fix(admin): complete Phase 5A final cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply deterministic Phase 5A source cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/admin/page.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1. Remove synthetic trade seeding state and handler.
          text = text.replace("  const [isSeedingTrades, setIsSeedingTrades] = useState<boolean>(false);\n", "")
          text, count = re.subn(
              r"\n  const handleSeedTrades = async \(count: number = 20\) => \{.*?\n  \};\n\n  const handleSyncDerivTicks = async \(\) => \{",
              "\n  const handleSyncDerivTicks = async () => {",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Phase 5A: handleSeedTrades was not found exactly once')

          # 2. Confidence/PnL charts must use persisted API data only.
          text, count = re.subn(
              r"\n  const defaultConfidenceBrackets = \[.*?\n  const confidenceBrackets = .*?\n\n  const defaultPnlCurve = \[.*?\n  const pnlCurve = .*?;\n",
              "\n  const confidenceBrackets = Array.isArray(statsData?.confidenceBrackets)\n    ? statsData.confidenceBrackets\n    : [];\n\n  const pnlCurve = Array.isArray(statsData?.pnlCurve)\n    ? statsData.pnlCurve\n    : [];\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Phase 5A: chart fallback block was not found exactly once')

          # 3. Remove the hard-coded historical ensemble dataset.
          text, count = re.subn(
              r"\n  const defaultEnsembleData = \[.*?\n  \];\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Phase 5A: hard-coded ensemble dataset was not found exactly once')

          text = text.replace(
              "  const ensembleData = calculatedEnsemble.length > 0 ? calculatedEnsemble : defaultEnsembleData;",
              "  const ensembleData = calculatedEnsemble;",
          )

          # 4. Remove legacy production/demo labels.
          text = text.replace("registryModels?.[0]?.model_id || 'XGBoost-Default'", "registryModels?.[0]?.model_id || 'No production model'")
          text = text.replace("{isDbConnected ? 'Demo & Live' : 'Database Offline'}", "{hasLiveTradeRecords ? 'Persisted live trade records' : 'No live trade records'}")

          # 5. Explicitly derive live-record state from persisted summary data.
          anchor = "  const summary = (statsData?.summary && statsData.summary.totalTrades > 0)\n    ? statsData.summary\n    : defaultSummary;"
          replacement = "  const summary = (statsData?.summary && Number(statsData.summary.totalTrades) > 0)\n    ? { ...defaultSummary, ...statsData.summary }\n    : defaultSummary;\n\n  const hasLiveTradeRecords = Number(summary.totalTrades) > 0;"
          if anchor not in text:
              raise SystemExit('Phase 5A: summary anchor not found')
          text = text.replace(anchor, replacement, 1)

          # 6. Remove the Seed 20 Test Trades control while preserving surrounding layout.
          button_pattern = re.compile(
              r"\n\s*<button\s+onClick=\{\(\) => handleSeedTrades\(20\)\}.*?</button>\n",
              re.S,
          )
          text, count = button_pattern.subn("\n", text, count=1)
          if count != 1:
              raise SystemExit('Phase 5A: Seed 20 Test Trades button was not found exactly once')

          # 7. Never manufacture win/loss history in empty states.
          text = text.replace("{summary.wins || 54}", "{summary.wins ?? 0}")
          text = text.replace("{summary.losses || 9}", "{summary.losses ?? 0}")

          forbidden = [
              'isSeedingTrades',
              'handleSeedTrades',
              'Seed 20 Test Trades',
              'defaultConfidenceBrackets',
              'defaultPnlCurve',
              'defaultEnsembleData',
              'XGBoost-Default',
              'Demo & Live',
              'summary.wins || 54',
              'summary.losses || 9',
          ]
          leftovers = [needle for needle in forbidden if needle in text]
          if leftovers:
              raise SystemExit('Phase 5A legacy remnants: ' + ', '.join(leftovers))

          if text == original:
              raise SystemExit('Phase 5A: source was unchanged')

          path.write_text(text, encoding='utf-8')

      - name: Verify source integrity
        shell: bash
        run: |
          ! grep -nE "isSeedingTrades|handleSeedTrades|Seed 20 Test Trades|defaultConfidenceBrackets|defaultPnlCurve|defaultEnsembleData|XGBoost-Default|Demo & Live|summary\.wins \|\| 54|summary\.losses \|\| 9" app/admin/page.tsx
          grep -n "const ensembleData = calculatedEnsemble" app/admin/page.tsx
          grep -n "const confidenceBrackets" app/admin/page.tsx
          grep -n "const pnlCurve" app/admin/page.tsx
          grep -n "const hasLiveTradeRecords" app/admin/page.tsx
          grep -n "No production model" app/admin/page.tsx

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Production build validation
        run: npm run build

      - name: Commit verified cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/phase5a-final-cleanup.yml
          git add app/admin/page.tsx .github/workflows/phase5a-final-cleanup.yml tsconfig.json
          git diff --cached --check
          git commit -m "fix(admin): complete Phase 5A final cleanup"
          git push origin main
