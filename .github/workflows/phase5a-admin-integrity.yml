name: Phase 5A Admin Integrity Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'fix(admin): Phase 5A admin integrity cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Apply Phase 5A Admin UI integrity changes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/admin/page.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace("  const [isSeedingTrades, setIsSeedingTrades] = useState<boolean>(false);\n", "")
          text, removed = re.subn(
              r"\n  const handleSeedTrades = async \(count: number = 20\) => \{.*?\n  \};\n\n  const handleSyncDerivTicks",
              "\n  const handleSyncDerivTicks",
              text, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit('Phase 5A: seed-trade handler was not found exactly once')

          text = re.sub(
              r"\n  const defaultConfidenceBrackets = \[.*?\n  const confidenceBrackets = .*?\n\n  const defaultPnlCurve = \[.*?\n  const pnlCurve = .*?\n",
              "\n  const confidenceBrackets = Array.isArray(statsData?.confidenceBrackets)\n    ? statsData.confidenceBrackets\n    : [];\n\n  const pnlCurve = Array.isArray(statsData?.pnlCurve)\n    ? statsData.pnlCurve\n    : [];\n",
              text, count=1, flags=re.S)

          text = re.sub(
              r"\n  const defaultEnsembleData = \[.*?\n  \];\n\n  const ensembleData = calculatedEnsemble.length > 0 \? calculatedEnsemble : defaultEnsembleData;",
              "\n  const ensembleData = calculatedEnsemble;",
              text, count=1, flags=re.S)

          text = re.sub(
              r"  const summary = \(statsData\?\.summary && statsData\.summary\.totalTrades > 0\)\n    \? statsData\.summary\n    : defaultSummary;",
              "  const summary = statsData?.summary\n    ? { ...defaultSummary, ...statsData.summary }\n    : defaultSummary;\n\n  const hasLiveTradeRecords = isFinite(Number(summary.totalTrades)) && Number(summary.totalTrades) > 0;",
              text, count=1)

          text = text.replace("(registryModels?.[0]?.model_id || 'XGBoost-Default')", "(registryModels?.[0]?.model_id || 'No production model')")
          text = text.replace("{isDbConnected ? 'Demo & Live' : 'Database Offline'}", "{hasLiveTradeRecords ? 'Persisted live trade records' : 'No live trade records'}")
          text = text.replace("{summary.wins || 54}", "{summary.wins ?? 0}")
          text = text.replace("{summary.losses || 9}", "{summary.losses ?? 0}")

          seed_button = re.compile(
              r"\n                <button\n                  onClick=\{\(\) => handleSeedTrades\(20\)\}\n                  disabled=\{isSeedingTrades\}\n                  className=\{`px-3\.5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 to-teal-500 text-white text-xs font-bold shadow-lg shadow-emerald-950/40 flex items-center gap-2 transition-all disabled:opacity-50`\}\n                >.*?<span>Seed 20 Test Trades</span>\n                </button>",
              flags=re.S)
          if not seed_button.search(text):
              seed_button = re.compile(r"\n                <button\n                  onClick=\{\(\) => handleSeedTrades\(20\)\}.*?<span>Seed 20 Test Trades</span>\n                </button>", flags=re.S)
          text, removed = seed_button.subn(
              "\n                <span className={`px-3.5 py-2 rounded-xl text-xs font-bold border flex items-center gap-2 ${hasLiveTradeRecords ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>\n                  <Database className=\"w-3.5 h-3.5\" />\n                  <span>{hasLiveTradeRecords ? 'Live DB Records' : 'No Live Trade Records'}</span>\n                </span>",
              text, count=1)
          if removed != 1:
              raise SystemExit('Phase 5A: seed-trade button was not found exactly once')

          marker = "            {/* Security & Health Widget */}"
          banner = """            {!hasLiveTradeRecords && (\n              <div className=\"w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center gap-3 text-slate-300 text-xs\">\n                <Database className=\"w-5 h-5 text-slate-500 shrink-0\" />\n                <div>\n                  <span className=\"font-bold block text-slate-200 text-sm mb-0.5\">No live trade records yet</span>\n                  <span className=\"text-slate-400\">Performance charts and ensemble statistics are sourced only from persisted database trades. No demo or synthetic trade results are displayed.</span>\n                </div>\n              </div>\n            )}\n\n"""
          if marker not in text:
              raise SystemExit('Phase 5A: overview insertion marker was not found')
          text = text.replace(marker, banner + marker, 1)

          if text == original:
              raise SystemExit('Phase 5A: no changes were made')
          path.write_text(text, encoding='utf-8')

      - name: Install dependencies for validation
        run: npm ci --ignore-scripts

      - name: TypeScript validation
        run: npx tsc --noEmit --pretty false

      - name: Verify synthetic admin fallbacks are gone
        run: |
          ! grep -n "Seed 20 Test Trades\|XGBoost-Default\|Random Forest Baseline\|89.5\|84.0\|83.3\|75.0\|summary.wins || 54\|summary.losses || 9" app/admin/page.tsx
          grep -n "No live trade records yet\|const ensembleData = calculatedEnsemble\|hasLiveTradeRecords" app/admin/page.tsx

      - name: Commit Phase 5A changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/phase5a-admin-integrity.yml
          git add app/admin/page.tsx .github/workflows/phase5a-admin-integrity.yml
          git commit -m "fix(admin): Phase 5A admin integrity cleanup"
          git push origin main
