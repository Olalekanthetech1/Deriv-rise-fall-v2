name: Phase 5A Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deterministic 5A cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          admin = root / 'app/admin/page.tsx'
          if not admin.exists():
              raise SystemExit('app/admin/page.tsx not found')
          text = admin.read_text(encoding='utf-8')

          def remove_line_containing(src, marker):
              lines = src.splitlines(True)
              return ''.join(line for line in lines if marker not in line)

          def remove_const(src, name):
              m = re.search(r'(?m)^\s*(?:export\s+)?const\s+' + re.escape(name) + r'\s*=', src)
              if not m:
                  return src, False
              start = m.start()
              eq = src.find('=', m.start())
              i = eq + 1
              depth = {'(': 0, '[': 0, '{': 0}
              pairs = {')': '(', ']': '[', '}': '{'}
              quote = None
              escaped = False
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch in '([{':
                          depth[ch] += 1
                      elif ch in ')]}':
                          depth[pairs[ch]] -= 1
                      elif ch == ';' and all(v == 0 for v in depth.values()):
                          i += 1
                          break
                  i += 1
              return src[:start] + src[i:], True

          def remove_const_containing(src, marker_text):
              pos = src.find(marker_text)
              if pos < 0:
                  return src, False
              line_start = src.rfind('\n', 0, pos) + 1
              before = src[:line_start]
              matches = list(re.finditer(r'(?m)^\s*(?:export\s+)?const\s+[A-Za-z0-9_$]+\s*=', before))
              if not matches:
                  raise SystemExit(f'Found {marker_text!r} but could not locate containing const')
              name_m = re.search(r'const\s+([A-Za-z0-9_$]+)\s*=', matches[-1].group(0))
              if not name_m:
                  raise SystemExit(f'Could not determine containing const for {marker_text!r}')
              return remove_const(src, name_m.group(1))

          def remove_function(src, name):
              patterns = [
                  r'(?m)^\s*const\s+' + re.escape(name) + r'\s*=\s*(?:async\s*)?',
                  r'(?m)^\s*async\s+function\s+' + re.escape(name) + r'\s*\('
              ]
              m = next((re.search(p, src) for p in patterns if re.search(p, src)), None)
              if not m:
                  return src, False
              start = m.start()
              brace = src.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'Function {name} found without body')
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              i += 1
                              if i < len(src) and src[i] == ';':
                                  i += 1
                              return src[:start] + src[i:], True
                  i += 1
              raise SystemExit(f'Unbalanced body for {name}')

          def remove_button_with_text(src, label):
              pos = src.find(label)
              if pos < 0:
                  return src, False
              start = src.rfind('<button', 0, pos)
              if start < 0:
                  raise SystemExit(f'Found {label!r} but no opening button')
              depth = 0
              for m in re.finditer(r'<button\b|</button>', src[start:]):
                  token = m.group(0)
                  if token.startswith('<button'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = start + m.end()
                          return src[:start] + src[end:], True
              raise SystemExit(f'Unbalanced button containing {label!r}')

          # Admin dashboard cleanup.
          text = remove_line_containing(text, 'isSeedingTrades')
          text, _ = remove_function(text, 'handleSeedTrades')
          text, _ = remove_button_with_text(text, 'Seed 20 Test Trades')
          for name in ('defaultConfidenceBrackets', 'defaultPnlCurve'):
              text, _ = remove_const(text, name)

          # Remove known hard-coded ensemble performance data from TS/TSX UI/data definitions.
          markers = ('XGBoost Horizon 5t', 'LightGBM — 84.0%', 'ONNX — 83.3%', 'Random Forest — 75.0%')
          changed_paths = set()
          for path in root.rglob('*'):
              if path.suffix not in ('.ts', '.tsx') or 'node_modules' in path.parts or '.next' in path.parts:
                  continue
              try:
                  src = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for marker in markers:
                  if marker not in src:
                      continue
                  src2, changed = remove_const_containing(src, marker)
                  if changed:
                      path.write_text(src2, encoding='utf-8')
                      changed_paths.add(str(path))
                      src = src2

          # Truthful labels; no fabricated production model or demo records.
          text = text.replace('XGBoost-Default', 'No production model')
          text = text.replace('Demo & Live', 'Live records')
          text = text.replace('Demo &amp; Live', 'Live records')
          admin.write_text(text, encoding='utf-8')

          forbidden = [
              'isSeedingTrades', 'handleSeedTrades', 'Seed 20 Test Trades',
              'defaultConfidenceBrackets', 'defaultPnlCurve',
              'XGBoost Horizon 5t', 'LightGBM — 84.0%', 'ONNX — 83.3%',
              'Random Forest — 75.0%', 'XGBoost-Default', 'Demo & Live'
          ]
          hits = []
          for path in root.rglob('*'):
              if path.suffix not in ('.ts', '.tsx') or 'node_modules' in path.parts or '.next' in path.parts:
                  continue
              try:
                  src = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for marker in forbidden:
                  if marker in src:
                      hits.append(f'{path}: {marker}')
          if hits:
              print('\n'.join(hits))
              raise SystemExit(1)

          print('5A source cleanup verification passed.')

      - name: Install dependencies
        run: npm ci

      - name: Production build verification
        run: npm run build

      - name: Commit verified cleanup and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/phase5a-finalize.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: complete Phase 5A admin dashboard cleanup'
          git push origin main
