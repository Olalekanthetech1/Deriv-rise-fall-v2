name: Phase 5A Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deterministic 5A cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          admin = root / 'app/admin/page.tsx'
          if not admin.exists():
              raise SystemExit('app/admin/page.tsx not found')
          text = admin.read_text(encoding='utf-8')
          original = text

          def remove_line_containing(src, marker):
              return '\n'.join(line for line in src.splitlines() if marker not in line) + ('\n' if src.endswith('\n') else '')

          def remove_const(src, name):
              marker = re.compile(r'(^|\\n)([ \\t]*)(?:export[ \\t]+)?const[ \\t]+' + re.escape(name) + r'\\s*=')
              m = marker.search(src)
              if not m:
                  return src, False
              start = m.start(0) + (1 if m.group(1) else 0)
              eq = src.find('=', m.start())
              i = eq + 1
              depth = {'(': 0, '[': 0, '{': 0}
              pairs = {')': '(', ']': '[', '}': '{'}
              quote = None
              escaped = False
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch in '([{':
                          depth[ch] += 1
                      elif ch in ')]}':
                          depth[pairs[ch]] -= 1
                      elif ch == ';' and all(v == 0 for v in depth.values()):
                          i += 1
                          break
                  i += 1
              return src[:start] + src[i:], True

          def remove_const_containing(src, marker_text):
              pos = src.find(marker_text)
              if pos < 0:
                  return src, False
              line_start = src.rfind('\n', 0, pos) + 1
              before = src[:line_start]
              matches = list(re.finditer(r'(?m)^\\s*(?:export\\s+)?const\\s+[A-Za-z0-9_$]+\\s*=', before))
              if not matches:
                  raise SystemExit(f'Found {marker_text!r} but could not locate containing const')
              start = matches[-1].start()
              name_m = re.search(r'const\\s+([A-Za-z0-9_$]+)\\s*=', matches[-1].group(0))
              name = name_m.group(1)
              out, ok = remove_const(src, name)
              if not ok:
                  raise SystemExit(f'Could not remove containing const {name}')
              return out, True

          def remove_function(src, name):
              m = re.search(r'(?m)^\\s*const\\s+' + re.escape(name) + r'\\s*=\\s*async?\\s*', src)
              if not m:
                  m = re.search(r'(?m)^\\s*async\\s+function\\s+' + re.escape(name) + r'\\s*\\(', src)
              if not m:
                  return src, False
              start = m.start()
              brace = src.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'Function {name} found without body')
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              i += 1
                              if i < len(src) and src[i] == ';':
                                  i += 1
                              return src[:start] + src[i:], True
                  i += 1
              raise SystemExit(f'Unbalanced body for {name}')

          def remove_button_with_text(src, label):
              pos = src.find(label)
              if pos < 0:
                  return src, False
              start = src.rfind('<button', 0, pos)
              if start < 0:
                  raise SystemExit(f'Found {label!r} but no opening button')
              depth = 0
              token = re.compile(r'<button\\b|</button>')
              end = None
              for m in token.finditer(src, start):
                  if m.group(0).startswith('<button'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = m.end()
                          break
              if end is None:
                  raise SystemExit(f'Unbalanced button containing {label!r}')
              return src[:start] + src[end:], True

          # 1) Remove seeding state and handler/button from the Admin Dashboard.
          text = remove_line_containing(text, 'isSeedingTrades')
          text, _ = remove_function(text, 'handleSeedTrades')
          text, _ = remove_button_with_text(text, 'Seed 20 Test Trades')

          # 2) Remove synthetic confidence/PnL defaults if present.
          for name in ('defaultConfidenceBrackets', 'defaultPnlCurve'):
              text, _ = remove_const(text, name)

          # 3) Remove the known hard-coded ensemble performance dataset wherever it lives in admin UI code.
          for marker in ('XGBoost Horizon 5t', 'LightGBM', 'Random Forest'):
              for path in root.rglob('*'):
                  if path.suffix not in ('.ts', '.tsx') or 'node_modules' in path.parts or '.next' in path.parts:
                      continue
                  try:
                      src = path.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  if marker not in src:
                      continue
                  if path == admin:
                      src2, changed = remove_const_containing(src, marker)
                  else:
                      # Only remove a containing const in UI/data-definition files; fail closed for arbitrary files.
                      src2, changed = remove_const_containing(src, marker)
                  if changed:
                      path.write_text(src2, encoding='utf-8')
                      if path == admin:
                          text = src2

          # 4) Replace legacy model/status labels with truthful empty/live semantics.
          text = text.replace('XGBoost-Default', 'No production model')
          text = text.replace('Demo & Live', 'Live records')
          text = text.replace('Demo &amp; Live', 'Live records')

          if text != original:
              admin.write_text(text, encoding='utf-8')

          # 5) Verify the legacy 5A markers are gone from source code.
          forbidden = [
              'isSeedingTrades', 'handleSeedTrades', 'Seed 20 Test Trades',
              'defaultConfidenceBrackets', 'defaultPnlCurve',
              'XGBoost Horizon 5t', 'XGBoost-Default', 'Demo & Live'
          ]
          hits = []
          for path in root.rglob('*'):
              if path.suffix not in ('.ts', '.tsx') or 'node_modules' in path.parts or '.next' in path.parts:
                  continue
              try:
                  src = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for marker in forbidden:
                  if marker in src:
                      hits.append(f'{path}: {marker}')
          if hits:
              print('Remaining 5A markers:')
              print('\n'.join(hits))
              raise SystemExit(1)

          print('5A deterministic cleanup completed.')

      - name: Install dependencies
        run: npm ci

      - name: Production build verification
        run: npm run build

      - name: Commit verified cleanup and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/phase5a-finalize.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: complete Phase 5A admin dashboard cleanup'
          git push origin main
