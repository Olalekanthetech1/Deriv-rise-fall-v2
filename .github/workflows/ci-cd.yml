name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Typecheck
      run: npm run typecheck || echo "Implement strict typecheck"
      
    - name: Security Audit
      run: npm audit --audit-level=high || true
      
    - name: Build Next.js
      run: npm run build
      env:
        DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
        NEXT_PUBLIC_DERIV_APP_ID: 1234
        
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: docker build -t ai-trading-app:latest .
