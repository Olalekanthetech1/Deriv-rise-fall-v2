services:
  - type: web
    name: deriv-ai-trading-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /api/ml/status
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_DERIV_APP_ID
        sync: false
